    <line x1="0" y1="44" x2="330" y2="44" stroke="#1a2633" stroke-width="1"/>
    <circle cx="24" cy="22" r="5" fill="#ff5f56"/>
    <circle cx="42" cy="22" r="5" fill="#ffbd2e"/>
    <circle cx="60" cy="22" r="5" fill="#27c93f"/>
    <text x="80" y="27" font-family="Consolas, monospace" font-size="13" fill="#5e7185">bash — ~/portfolio</text>
    <text x="24" y="86" font-family="Consolas, monospace" font-size="15" fill="#38f2a5">$ <tspan fill="#d9e4ef">whoami</tspan></text>
    <text x="24" y="114" font-family="Consolas, monospace" font-size="15" fill="#8a9caf">QuantCoder Wang · engineer</text>
    <text x="24" y="152" font-family="Consolas, monospace" font-size="15" fill="#38f2a5">$ <tspan fill="#d9e4ef">cat focus.txt</tspan></text>
    <text x="24" y="180" font-family="Consolas, monospace" font-size="15" fill="#8a9caf">code · data · finance</text>
    <text x="24" y="218" font-family="Consolas, monospace" font-size="15" fill="#38f2a5">$ <tspan fill="#4cc9f0">./contact.sh</tspan></text>
    <text x="24" y="246" font-family="Consolas, monospace" font-size="15" fill="#4cc9f0">→ wangyuwen6@outlook.com</text>
    <rect x="24" y="258" width="10" height="2" fill="#38f2a5"/>
  </g>

  <text x="80" y="556" font-family="Consolas, monospace" font-size="18" fill="#5e7185">github.com/QuantCoderWang</text>
  <text x="80" y="584" font-family="Consolas, monospace" font-size="18" fill="#5e7185">gitee.com/QuantCoder_Wang</text>

  <text x="1120" y="576" text-anchor="end" font-family="Consolas, monospace" font-size="120" font-weight="700" fill="#38f2a5" opacity=".1">&gt;_</text>
