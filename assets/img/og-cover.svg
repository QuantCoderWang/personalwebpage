<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="QuantCoder Wang 个人主页分享封面">
  <defs>
    <linearGradient id="og-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05080c"/>
      <stop offset=".6" stop-color="#08121a"/>
      <stop offset="1" stop-color="#0a1a20"/>
    </linearGradient>
    <linearGradient id="og-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38f2a5"/>
      <stop offset="1" stop-color="#4cc9f0"/>
    </linearGradient>
    <pattern id="og-grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity=".045" stroke-width="1"/>
    </pattern>
    <radialGradient id="og-glow" cx=".2" cy=".15" r=".8">
      <stop offset="0" stop-color="#38f2a5" stop-opacity=".18"/>
      <stop offset="1" stop-color="#38f2a5" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#og-bg)"/>
  <rect width="1200" height="630" fill="url(#og-grid)"/>
  <rect width="1200" height="630" fill="url(#og-glow)"/>
  <rect x="1" y="1" width="1198" height="628" fill="none" stroke="#1a2633" stroke-width="2"/>

  <text x="80" y="118" font-family="Consolas, 'Cascadia Code', monospace" font-size="20" letter-spacing="4" fill="#38f2a5">// PORTFOLIO</text>

  <text x="78" y="258" font-family="Consolas, 'Cascadia Code', monospace" font-size="92" font-weight="700" letter-spacing="-2" fill="#f2f7fb">QC Wang</text>

  <rect x="80" y="292" width="96" height="4" rx="2" fill="url(#og-accent)"/>

  <text x="80" y="352" font-family="Consolas, 'Cascadia Code', monospace" font-size="24" letter-spacing="2" fill="#4cc9f0">ENGINEER · ALGORITHMS · DATA · FINANCE</text>
  <text x="80" y="396" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="24" fill="#8a9caf">编程 / 算法 / 数据 / 金融 · 用代码构建可验证的价值</text>

  <g transform="translate(790 150)">
