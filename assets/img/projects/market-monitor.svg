<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="market-monitor 项目封面占位图">
  <defs>
    <linearGradient id="m-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171008"/>
      <stop offset="1" stop-color="#05080c"/>
    </linearGradient>
    <linearGradient id="m-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f7c948" stop-opacity=".25"/>
      <stop offset="1" stop-color="#ff6b6b"/>
    </linearGradient>
    <pattern id="m-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#f7c948" stroke-opacity=".06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#m-bg)"/>
  <rect width="800" height="500" fill="url(#m-grid)"/>

  <text x="50" y="92" font-family="Consolas, monospace" font-size="14" letter-spacing="3" fill="#f7c948">// PROJECT 06</text>
  <text x="50" y="154" font-family="Consolas, 'Cascadia Code', monospace" font-size="38" font-weight="700" fill="#f2f7fb">market-monitor</text>
  <text x="50" y="194" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="19" fill="#8a9caf">行情监控与告警</text>

  <rect x="50" y="218" width="64" height="3" rx="1.5" fill="#f7c948"/>
  <text x="50" y="254" font-family="Consolas, monospace" font-size="13" fill="#4cc9f0">Go · Redis · WebSocket</text>
  <text x="50" y="284" font-family="Consolas, monospace" font-size="13" fill="#5e7185">MULTI-MARKET FEED</text>
  <text x="50" y="306" font-family="Consolas, monospace" font-size="13" fill="#5e7185">RULE-BASED ALERTS</text>

  <g>
    <rect x="396" y="104" width="354" height="292" rx="12" fill="#070c11" stroke="#3d3420" stroke-width="1.5"/>
    <text x="416" y="134" font-family="Consolas, monospace" font-size="12" fill="#5e7185">WATCHLIST · LIVE</text>
    <circle cx="726" cy="130" r="4" fill="#38f2a5"/>
    <text x="716" y="134" text-anchor="end" font-family="Consolas, monospace" font-size="11" fill="#38f2a5">online</text>
    <line x1="416" y1="150" x2="730" y2="150" stroke="#1a2633"/>

    <g stroke="#1a2633" stroke-width="1">
      <line x1="416" y1="200" x2="730" y2="200"/>
      <line x1="416" y1="250" x2="730" y2="250"/>
      <line x1="416" y1="300" x2="730" y2="300"/>
      <line x1="416" y1="350" x2="730" y2="350"/>
    </g>

    <line x1="416" y1="224" x2="730" y2="224" stroke="#ff6b6b" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="730" y="218" text-anchor="end" font-family="Consolas, monospace" font-size="10" fill="#ff6b6b">threshold</text>

    <path d="M416 330 L452 312 L488 318 L524 286 L560 296 L596 262 L632 270 L668 238 L704 246 L730 228" fill="none" stroke="url(#m-line)" stroke-width="2.5" stroke-linejoin="round"/>

    <circle cx="668" cy="238" r="6" fill="#f7c948"/>
    <circle cx="668" cy="238" r="13" fill="none" stroke="#f7c948" stroke-opacity=".35" stroke-width="1.5"/>

    <rect x="596" y="300" width="126" height="40" rx="8" fill="#171008" stroke="#f7c948" stroke-opacity=".5"/>
    <text x="610" y="317" font-family="Consolas, monospace" font-size="10" fill="#f7c948">ALERT</text>
    <text x="610" y="331" font-family="Consolas, monospace" font-size="10" fill="#8a9caf">price &gt; 1.284</text>
  </g>

  <text x="50" y="456" font-family="Consolas, monospace" font-size="12" letter-spacing="1" fill="#3f5062">PLACEHOLDER · 替换为项目截图</text>
</svg>
