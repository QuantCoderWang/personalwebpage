<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="llm-rag-starter 项目封面占位图">
  <defs>
    <linearGradient id="r-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#170a18"/>
      <stop offset="1" stop-color="#05080c"/>
    </linearGradient>
    <linearGradient id="r-link" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f472b6" stop-opacity=".35"/>
      <stop offset="1" stop-color="#4cc9f0" stop-opacity=".55"/>
