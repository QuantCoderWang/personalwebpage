<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — 页面走丢了</title>
  <meta name="description" content="页面不存在。">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#05080c">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/components.css">

  <script>
    (function () {
      var d = document.documentElement;
      d.classList.add('js');
      try {
        var t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark') d.dataset.theme = t;
        if (localStorage.getItem('effects') === 'off') d.dataset.effects = 'off';
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <a class="skip-link" href="#main">跳到主内容</a>

  <canvas id="matrix" aria-hidden="true"></canvas>
  <div class="bg-grid" aria-hidden="true"></div>
  <div class="bg-glow" aria-hidden="true"></div>

  <header class="site-header" id="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html" aria-label="返回首页">
        <span class="brand-mark">~/</span><span data-bind="handle">yourname</span><span class="brand-cursor" aria-hidden="true"></span>
      </a>

      <nav class="nav" id="site-nav" aria-label="主导航">
        <a class="nav-link" href="index.html" data-nav="index">首页</a>
        <a class="nav-link" href="projects.html" data-nav="projects">作品</a>
        <a class="nav-link" href="resume.html" data-nav="resume">简历</a>
        <a class="nav-link" href="index.html#contact" data-nav="contact">联系</a>
      </nav>

      <div class="header-actions">
        <button class="cmd-trigger" type="button" data-cmd-open aria-label="打开命令面板">
          <span class="cmd-trigger-icon" aria-hidden="true">&gt;_</span>
          <span class="cmd-trigger-label">Ctrl K</span>
        </button>
        <button class="icon-btn" type="button" data-theme-toggle aria-label="切换主题" title="切换主题">
          <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" stroke-linejoin="round"/>
          </svg>
          <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke-linecap="round"/>
          </svg>
        </button>
        <button class="icon-btn menu-toggle" type="button" data-menu-toggle aria-expanded="false" aria-controls="site-nav" aria-label="打开菜单">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </header>

  <main id="main">
    <section class="notfound">
      <div class="container">
        <div class="notfound-card reveal">
          <p class="notfound-cmd"><span class="prompt">$</span> curl -I /this-page</p>
          <p class="notfound-code" aria-hidden="true">404</p>
          <h1>页面走丢了</h1>
          <p>你访问的路径不存在，可能是链接写错了，或者这个页面已经被移动。</p>
          <div class="notfound-actions">
            <a class="btn btn--primary" href="index.html">返回首页</a>
            <a class="btn btn--ghost" href="projects.html">看看作品</a>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom">
        <span>© <span data-year>2026</span> <span data-bind="name">YOUR NAME</span> · Built with vanilla HTML / CSS / JS</span>
        <span class="footer-status"><span class="status-dot" aria-hidden="true"></span> system.online</span>
      </div>
    </div>
  </footer>

  <script src="assets/js/data.js" defer></script>
  <script src="assets/js/main.js" defer></script>
</body>
</html>
