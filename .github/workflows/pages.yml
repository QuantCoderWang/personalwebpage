name: Deploy to GitHub Pages

# 纯静态站点，无需构建：直接把仓库根目录作为 Pages 产物上传。
# 使用前请在仓库 Settings → Pages → Build and deployment 中选择 "GitHub Actions"。
# 如果你更习惯分支部署（Deploy from a branch），可以删除本文件。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
